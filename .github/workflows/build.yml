name: Unpack site
on:
  push:
    branches: [main]
    paths:
      - 'site.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip site.zip
        run: |
          if [ -f site.zip ]; then
            unzip -o site.zip
            rm site.zip
          fi
      - name: Commit unpacked files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack site.zip" || echo "Nothing to commit"
          git push
